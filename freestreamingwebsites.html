        // Generate sidebar menu
        function generateSidebar() {
            const menu = document.getElementById('sidebar-menu');
            let index = 0;
            for (const category in siteData) {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#section-${index}`;
                a.className = 'smooth';
                a.setAttribute('tabindex', __pageNavAware ? '-1' : '0');
                a.setAttribute('data-zone', 'category');
                a.setAttribute('data-category', category);
                a.innerHTML = `<i class="${categoryIcons[category] || categoryIcons.default}"></i><span>${category}</span>`;
                li.appendChild(a);
                menu.appendChild(li);
                index++;
            }
        }

        // Generate main content
        function generateContent() {
            const content = document.getElementById('main-content');
            let index = 0;
            for (const category in siteData) {
                const header = document.createElement('div');
                header.className = 'section-header';
                header.id = `section-${index}`;
                header.innerHTML = `
                    <i class="${categoryIcons[category] || categoryIcons.default}"></i>
                    <h4>${category}</h4>
                `;
                content.appendChild(header);

                const row = document.createElement('div');
                row.className = 'row g-3 overflow-hidden';

                const linkTarget = __pageNavAware ? '' : 'target="_blank"';
                const linkTabindex = __pageNavAware ? '-1' : '0';

                siteData[category].forEach(site => {
                    const col = document.createElement('div');
                    col.className = 'col-sm-6 col-md-4 col-lg-3';

                    const faviconUrl = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(site.url)}&sz=64`;
                    const faviconUrl2 = `https://icons.duckduckgo.com/ip3/${new URL(site.url).hostname}.ico`;
                    
                    // Generate a deterministic color from site name
                    const colors = ['#e53935','#d81b60','#8e24aa','#5e35b1','#3949ab','#1e88e5','#039be5','#00acc1','#00897b','#43a047','#7cb342','#c0ca33','#fdd835','#ffb300','#fb8c00','#f4511e'];
                    let hash = 0;
                    for (let c = 0; c < site.name.length; c++) hash = ((hash << 5) - hash + site.name.charCodeAt(c)) | 0;
                    const avatarColor = colors[Math.abs(hash) % colors.length];
                    const firstChar = site.name.replace(/^[^a-zA-Z\u4e00-\u9fff\u0600-\u06ff\u0900-\u097f\u0a80-\u0aff\u0b80-\u0bff\u0d80-\u0dff\u1780-\u17ff\u0530-\u058f]/, '').charAt(0) || site.name.charAt(0);
                    
                    col.innerHTML = `
                        <div class="site-card">
                            <a href="${site.url}" ${linkTarget} rel="noopener noreferrer" tabindex="${linkTabindex}" data-zone="site">
                                <div class="icon">
                                    <img src="${faviconUrl}" alt="" onerror="this.src='${faviconUrl2}'; this.onerror=function(){this.style.display='none';this.parentElement.innerHTML='<div class=\\'letter-avatar\\' style=\\'background:${avatarColor}\\'>${firstChar}</div>'}">
                                </div>
                                <div class="info">
                                    <div class="title">${site.name}</div>
                                    <div class="desc">${site.desc || ''}</div>
                                </div>
                            </a>
                        </div>
                    `;
                    row.appendChild(col);
                });

                content.appendChild(row);
                index++;
            }
        }

        // Toggle sidebar for mobile
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        // Smooth scroll
        document.addEventListener('click', function(e) {
            if (e.target.closest('a.smooth')) {
                e.preventDefault();
                const targetId = e.target.closest('a.smooth').getAttribute('href');
                const targetElement = document.querySelector(targetId);
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    if (window.innerWidth <= 768) {
                        document.getElementById('sidebar').classList.remove('active');
                    }
                }
            }
        });

        // Deep-link
        function scrollToSectionFromUrl() {
            const params = new URLSearchParams(location.search);
            for (const key of params.keys()) {
                const category = categorySlugs[key.toLowerCase()];
                if (!category) continue;
                const index = Object.keys(siteData).indexOf(category);
                if (index === -1) continue;
                const target = document.getElementById('section-' + index);
                if (target) {
                    target.scrollIntoView({ block: 'start' });
                    return;
                }
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            __pageNavAware = isAppPageNavAware();
            if (__pageNavAware) {
                document.documentElement.classList.add('tv-pagenav');
            }
            generateSidebar();
            generateContent();
            scrollToSectionFromUrl();
            if (__pageNavAware) {
                requestNativePageNavigationMode();
            }
            initTvNavigation();
        });

        function requestNativePageNavigationMode() {
            var payload = JSON.stringify({
                runtimeId: 'free_streaming_websites',
                state: 'mounted',
                host: location.hostname || 'odin-browser.github.io',
                createdAt: Date.now()
            });
            var requestMode = function() {
                try {
                    if (window.NaviSwitch && typeof window.NaviSwitch.setPageNavMode === 'function') {
                        window.NaviSwitch.setPageNavMode();
                    }
                } catch (e) {}
                try {
                    if (window.AndroidJSInterface && typeof window.AndroidJSInterface.postMessage === 'function') {
                        window.AndroidJSInterface.postMessage('watch_mode_state', payload);
                    }
                } catch (e) {}
            };
            requestMode();
            setTimeout(requestMode, 150);
            setTimeout(requestMode, 600);
        }

        // ============================================================
        // TV Remote Navigation (UP/DOWN/LEFT/RIGHT/OK + mouse compat)
        // ============================================================
        function initTvNavigation() {
            const NAV_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', ' ']);
            let tvMode = false;
            let currentFocused = null;
            let lastFocusedKey = null;
            let pendingNavDir = null;
            let pendingNavFrame = 0;
            const itemCache = { all: null, category: null, site: null };

            function getItems(zone) {
                if (__pageNavAware) {
                    var key = zone || 'all';
                    if (itemCache[key]) return itemCache[key];
                    var sel1 = zone ? 'a[data-zone="' + zone + '"]' : 'a[data-zone]';
                    itemCache[key] = Array.from(document.querySelectorAll(sel1)).filter(function (el) {
                        var r = getRect(el);
                        return r && r.width > 0 && r.height > 0;
                    });
                    return itemCache[key];
                }
                var sel = zone ? 'a[data-zone="' + zone + '"]' : 'a[data-zone]';
                return Array.from(document.querySelectorAll(sel)).filter(function (el) {
                    var r = getRect(el);
                    return r && r.width > 0 && r.height > 0;
                });
            }

            function invalidateItemCache() {
                itemCache.all = null;
                itemCache.category = null;
                itemCache.site = null;
            }

            function getRect(el) {
                if (!el) return null;
                try {
                    var r = el.getBoundingClientRect();
                    if (r.width < 1 || r.height < 1) return null;
                    return r;
                } catch (e) { return null; }
            }

            function getCenter(el) {
                var r = getRect(el);
                if (!r) return { x: 0, y: 0 };
                return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
            }

            function setTvNavActive(active) {
                if (!document.body) return;
                document.body.classList.toggle('tv-nav-active', !!active);
            }

            function clearFocus() {
                var el = currentFocused || document.querySelector('.tv-focused');
                if (el) el.classList.remove('tv-focused');
                currentFocused = null;
            }

            function setFocus(el) {
                if (!el) return;
                if (__pageNavAware) {
                    if (currentFocused === el) {
                        if (!el.classList.contains('tv-focused')) el.classList.add('tv-focused');
                        scrollIntoViewCustom(el);
                        return;
                    }
                    var stale = currentFocused || document.querySelector('.tv-focused');
                    if (stale && stale !== el) stale.classList.remove('tv-focused');
                    currentFocused = el;
                    if (!el.classList.contains('tv-focused')) el.classList.add('tv-focused');
                    scrollIntoViewCustom(el);
                    return;
                }
                clearFocus();
                el.classList.add('tv-focused');
                try { el.focus({ preventScroll: true }); } catch (e) {}
                try { el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
            }

            function getCurrentFocused() {
                if (__pageNavAware) {
                    if (currentFocused && document.documentElement.contains(currentFocused)) {
                        return currentFocused;
                    }
                    currentFocused = document.querySelector('.tv-focused');
                    return currentFocused;
                }
                return document.querySelector('.tv-focused');
            }

            function scrollIntoViewCustom(el) {
                if (!__pageNavAware) {
                    try { el.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); } catch (e) {}
                    return;
                }
                var DOWN_RATIO = 0.60;
                var UP_RATIO = 0.25;
                var PADDING = 10;
                var sidebarParent = el.closest('.sidebar');
                var mainParent = el.closest('.main-content');
                var container = null;
                if (sidebarParent && sidebarParent.scrollHeight > sidebarParent.clientHeight + 1) {
                    container = sidebarParent;
                } else if (mainParent && mainParent.scrollHeight > mainParent.clientHeight + 1) {
                    container = mainParent;
                }
                var isManagedContainer = !!container;
                var elRect = el.getBoundingClientRect();
                var containerHeight, containerTop, scrollTop, scrollHeight;
                if (isManagedContainer) {
                    var cRect = container.getBoundingClientRect();
                    containerHeight = cRect.height;
                    containerTop = cRect.top;
                    scrollTop = container.scrollTop;
                    scrollHeight = container.scrollHeight;
                } else {
                    containerHeight = window.innerHeight;
                    containerTop = 0;
                    scrollTop = window.scrollY || document.documentElement.scrollTop;
                    scrollHeight = document.documentElement.scrollHeight;
                }
                var elTopInContent = elRect.top - containerTop + scrollTop;
                var elBottomInContent = elTopInContent + elRect.height;
                var sweetBottom = scrollTop + containerHeight * DOWN_RATIO;
                var sweetTop = scrollTop + containerHeight * UP_RATIO;
                var newScrollTop = scrollTop;
                if (elBottomInContent + PADDING > sweetBottom) {
                    newScrollTop = elBottomInContent + PADDING - containerHeight * DOWN_RATIO;
                } else if (elTopInContent - PADDING < sweetTop) {
                    newScrollTop = elTopInContent - PADDING - containerHeight * UP_RATIO;
                }
                var maxScroll = Math.max(0, scrollHeight - containerHeight);
                newScrollTop = Math.max(0, Math.min(newScrollTop, maxScroll));
                if (Math.abs(newScrollTop - scrollTop) < 1) return;
                if (isManagedContainer) {
                    container.scrollTop = newScrollTop;
                } else {
                    window.scrollTo(0, newScrollTop);
                }
            }

            function focusInitialCategory() {
                if (getCurrentFocused()) return;
                var target = getItems('category')[0] || getItems()[0];
                if (!target) return;
                tvMode = true;
                setTvNavActive(true);
                setFocus(target);
            }

            function scheduleInitialFocus() {
                try {
                    requestAnimationFrame(focusInitialCategory);
                } catch (e) {
                    setTimeout(focusInitialCategory, 0);
                }
                setTimeout(focusInitialCategory, 120);
            }

            function restoreLastFocusOrFirst() {
                if (getCurrentFocused()) return;
                var target = null;
                if (lastFocusedKey) {
                    var sites = getItems('site');
                    for (var i = 0; i < sites.length; i++) {
                        if (sites[i].href === lastFocusedKey) { target = sites[i]; break; }
                    }
                }
                if (!target) target = getItems('category')[0] || getItems()[0];
                if (!target) return;
                tvMode = true;
                setTvNavActive(true);
                setFocus(target);
            }

            function overlap(aStart, aEnd, bStart, bEnd) {
                return Math.max(0, Math.min(aEnd, bEnd) - Math.max(aStart, bStart));
            }

            function scoreCandidate(curCenter, curRect, cCenter, cRect, dir) {
                var dx = cCenter.x - curCenter.x;
                var dy = cCenter.y - curCenter.y;
                var hOverlap = overlap(curRect.left, curRect.right, cRect.left, cRect.right);
                var vOverlap = overlap(curRect.top, curRect.bottom, cRect.top, cRect.bottom);
                var minAxis = 8;
                if (dir === 'UP') {
                    if (dy >= -minAxis) return Infinity;
                    return Math.abs(dy) * 8 + Math.abs(dx) + (hOverlap > 0 ? 0 : Math.abs(dx) * 2);
                }
                if (dir === 'DOWN') {
                    if (dy <= minAxis) return Infinity;
                    return Math.abs(dy) * 8 + Math.abs(dx) + (hOverlap > 0 ? 0 : Math.abs(dx) * 2);
                }
                if (dir === 'LEFT') {
                    if (dx >= -minAxis) return Infinity;
                    return Math.abs(dx) * 8 + Math.abs(dy) + (vOverlap > 0 ? 0 : Math.abs(dy) * 2);
                }
                if (dir === 'RIGHT') {
                    if (dx <= minAxis) return Infinity;
                    return Math.abs(dx) * 8 + Math.abs(dy) + (vOverlap > 0 ? 0 : Math.abs(dy) * 2);
                }
                return Infinity;
            }

            function findTarget(candidates, current, dir) {
                var curCenter = getCenter(current);
                var curRect = getRect(current);
                if (!curRect) return null;
                var scored = [];
                for (var i = 0; i < candidates.length; i++) {
                    var c = candidates[i];
                    if (c === current) continue;
                    var cRect = getRect(c);
                    if (!cRect) continue;
                    var s = scoreCandidate(curCenter, curRect, getCenter(c), cRect, dir);
                    if (s < Infinity) scored.push({ el: c, score: s });
                }
                scored.sort(function (a, b) { return a.score - b.score; });
                return scored.length > 0 ? scored[0].el : null;
            }

            var DIR_MAP = { ArrowUp: 'UP', ArrowDown: 'DOWN', ArrowLeft: 'LEFT', ArrowRight: 'RIGHT' };

            function navigate(current, dir) {
                var zone = current.getAttribute('data-zone');
                var target = null;
                if (zone === 'category') {
                    if (dir === 'LEFT') return true;
                    if (dir === 'RIGHT') {
                        target = findTarget(getItems('site'), current, 'RIGHT');
                    } else {
                        target = findTarget(getItems('category'), current, dir);
                    }
                } else if (zone === 'site') {
                    if (dir === 'LEFT') {
                        target = findTarget(getItems('site'), current, 'LEFT')
                              || findTarget(getItems('category'), current, 'LEFT');
                    } else if (dir === 'RIGHT') {
                        target = findTarget(getItems('site'), current, 'RIGHT');
                    } else {
                        target = findTarget(getItems('site'), current, dir);
                    }
                }
                if (target) {
                    setFocus(target);
                } else if (__pageNavAware && dir === 'UP') {
                    requestToolbarHandoff(current);
                }
                return true;
            }

            var lastToolbarHandoffAt = 0;
            function requestToolbarHandoff(currentEl) {
                if (!__pageNavAware) return;
                if (!window.NaviSwitch || typeof window.NaviSwitch.requestNavBarFocus !== 'function') return;
                var now = Date.now();
                if (now - lastToolbarHandoffAt < 500) return;
                lastToolbarHandoffAt = now;
                var rect = getRect(currentEl) || { left: window.innerWidth / 2, width: 0 };
                var centerX = rect.left + rect.width / 2;
                var payload = {
                    site: 'free_streaming_websites',
                    handoffToken: 'fsw-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
                    routeKey: (location.pathname || '') + (location.search || '') + (location.hash || ''),
                    xRatio: Math.max(0, Math.min(1, centerX / Math.max(1, window.innerWidth))),
                    zone: 'catalog-top',
                    timestamp: now
                };
                try { window.NaviSwitch.requestNavBarFocus(JSON.stringify(payload)); } catch (e) {}
            }

            if (__pageNavAware) {
                window.__TV_PAGE_NAV_BRIDGE__ = {
                    restoreFromToolbar: function(handoffToken, routeKey) {
                        var target = getCurrentFocused() || getItems('category')[0] || getItems()[0];
                        if (!target) return false;
                        setFocus(target);
                        return true;
                    },
                    restoreAfterBrowserChrome: function(reason) {
                        var target = getCurrentFocused() || getItems('category')[0] || getItems()[0];
                        if (!target) return false;
                        setFocus(target);
                        return true;
                    },
                    clearSession: function() { return true; }
                };
            }

            function runDirectionalNavigation(dir) {
                var current = getCurrentFocused();
                if (!current) {
                    var items = getItems('category');
                    if (items.length > 0) setFocus(items[0]);
                    return;
                }
                navigate(current, dir);
            }

            function scheduleDirectionalNavigation(dir) {
                pendingNavDir = dir;
                if (pendingNavFrame) return;
                pendingNavFrame = requestAnimationFrame(function() {
                    var nextDir = pendingNavDir;
                    pendingNavFrame = 0;
                    pendingNavDir = null;
                    if (nextDir) runDirectionalNavigation(nextDir);
                });
            }

            function activateSiteLink(link) {
                if (!link || !link.href) return;
                lastFocusedKey = link.href;
                try { window.location.assign(link.href); }
                catch (e) { window.location.href = link.href; }
            }

            document.addEventListener('keydown', function (e) {
                if (!NAV_KEYS.has(e.key)) return;
                if (__pageNavAware) {
                    e.preventDefault();
                    e.stopPropagation();
                    if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
                    tvMode = true;
                    setTvNavActive(true);
                    var dirA = DIR_MAP[e.key];
                    if (dirA) {
                        if (e.repeat) scheduleDirectionalNavigation(dirA);
                        else runDirectionalNavigation(dirA);
                        return;
                    }
                    var currentA = getCurrentFocused();
                    if (!currentA) {
                        var itemsA = getItems('category');
                        if (itemsA.length > 0) setFocus(itemsA[0]);
                        return;
                    }
                    if (e.key === 'Enter' || e.key === ' ') {
                        if (currentA.getAttribute('data-zone') === 'site') {
                            activateSiteLink(currentA);
                        } else {
                            currentA.click();
                        }
                    }
                    return;
                }
                tvMode = true;
                var current = getCurrentFocused();
                var dir = DIR_MAP[e.key];
                if (!current) {
                    var items = getItems('category');
                    if (items.length > 0) setFocus(items[0]);
                    e.preventDefault();
                    return;
                }
                if (dir) {
                    navigate(current, dir);
                    e.preventDefault();
                    e.stopPropagation();
                } else if (e.key === 'Enter' || e.key === ' ') {
                    if (current.getAttribute('data-zone') === 'site') {
                        window.open(current.href, '_blank', 'noopener');
                    } else {
                        current.click();
                    }
                    e.preventDefault();
                    e.stopPropagation();
                }
            }, true);

            document.addEventListener('mousedown', function () {
                if (tvMode) {
                    tvMode = false;
                    if (__pageNavAware) setTvNavActive(false);
                    clearFocus();
                }
            });

            if (__pageNavAware) {
                window.addEventListener('resize', invalidateItemCache);
                window.addEventListener('pageshow', function() {
                    requestNativePageNavigationMode();
                    invalidateItemCache();
                    restoreLastFocusOrFirst();
                });
                scheduleInitialFocus();
            }
        }
    </script>
</body>
